name: test
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y tmux; else brew install tmux; fi
      - name: Unit + integration tests
        env:
          PEEK_INTEGRATION: "1"
        run: python -m unittest discover -s tests -v
      - name: Smoke
        run: |
          python peek.py --version
          python peek.py doctor
          python peek.py skill | head -5
