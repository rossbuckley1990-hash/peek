name: test
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 on macOS: Apple's built-in /usr/bin/python3 is 3.9, and the single-file install runs on it
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
          # setup-python has no 3.9 build for current Ubuntu images (3.9 is end-of-life)
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y tmux; else brew install tmux; fi
      - name: Unit + integration tests
        env:
          PEEK_INTEGRATION: "1"
        run: python -m unittest discover -s tests -v
      - name: Smoke
        run: |
          python peek.py --version
          python peek.py doctor
          python peek.py skill | head -5
